<!DOCTYPE html>
<html>
<head><style>body{background:#0b1a26; color:white; font-family:sans-serif; padding:20px;}</style></head>
<body>
    <h2>Data Analytics Quiz (10 Questions)</h2>
    <form id="quizForm">
        <script>
            const qs = ["SQL full form?", "What is Data?", "Python use?", "PowerBI?", "Tableau?", "Mean?", "Median?", "Mode?", "Database?", "Cloud?"];
            for(let i=1; i<=10; i++) {
                document.write(`<p>${i}. ${qs[i-1]}</p>
                <input type="radio" name="q${i}" value="1"> Correct <input type="radio" name="q${i}" value="0"> Wrong<br>`);
            }
        </script>
        <button type="button" onclick="submitQuiz()" style="margin-top:20px;">Submit Quiz</button>
    </form>
    <script>
        function submitQuiz() {
            let score = 0;
            for(let i=1; i<=10; i++) {
                if(document.querySelector(`input[name="q${i}"]:checked`)?.value == "1") score++;
            }
            alert("Quiz Submitted! Your Score: " + score + "/10");
            window.location.href = 'sqlanalysis.html';
        }
    </script>
</body>
</html>
