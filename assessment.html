<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analytics Quiz</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #111827; color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: flex; min-height: 100vh;
        }
        .sidebar {
            width: 260px; background-color: #1f2937; border-right: 1px solid #374151;
            padding: 25px 15px; display: flex; flex-direction: column; gap: 10px;
            position: fixed; height: 100vh; left: 0; top: 0;
        }
        .sidebar h2 { color: #38bdf8; font-size: 20px; margin: 0 0 25px 0; padding-left: 10px; font-weight: 600; }
        .sidebar a {
            color: #9ca3af; text-decoration: none; font-size: 16px; padding: 12px 15px;
            border-radius: 8px; display: flex; align-items: center; gap: 10px; transition: all 0.2s ease;
        }
        .sidebar a:hover, .sidebar a.active { background-color: #374151; color: #38bdf8; }
        .main-container { margin-left: 260px; flex-grow: 1; padding: 40px; background: #111827; }
        .header { border-bottom: 1px solid #374151; padding-bottom: 20px; margin-bottom: 35px; }
        .header h1 { margin: 0; color: #ffffff; font-size: 28px; }
        .header p { margin: 5px 0 0 0; color: #9ca3af; font-size: 14px; }
        .quiz-card {
            background-color: #1f2937; border: 1px solid #374151; border-radius: 12px;
            padding: 25px; margin-bottom: 25px;
        }
        .question { font-size: 16px; color: #ffffff; margin-bottom: 15px; font-weight: 600; }
        .option-label {
            display: block; background-color: #111827; border: 1px solid #374151;
            padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; cursor: pointer;
            font-size: 14px; color: #d1d5db; transition: all 0.2s ease;
        }
        .option-label:hover { border-color: #38bdf8; background-color: #1f2937; }
        .option-label input { margin-right: 10px; }
        .submit-btn {
            background-color: #10b981; color: white; border: none; padding: 12px 30px;
            border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.2s ease;
        }
        .submit-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>LMS Panel</h2>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="sqlanalysis.html">📚 My Courses</a>
        <a href="assessment.html" class="active">📝 Quizzes</a>
        <a href="certificate.html">🎓 Certificate</a>
        <a href="profile.html">👤 Profile</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <div class="main-container">
        <div class="header">
            <h1>Data Analytics Quiz</h1>
            <p>Apni learning test karne ke liye niche diye gaye sawalon ka jawab dein.</p>
        </div>

        <form id="quiz-form" onsubmit="submitQuiz(event)">
            <div class="quiz-card">
                <div class="question">1. What is Data Analytics?</div>
                <label class="option-label"><input type="radio" name="q1" value="wrong"> Designing websites</label>
                <label class="option-label"><input type="radio" name="q1" value="correct"> Analyzing data to find insights</label>
                <label class="option-label"><input type="radio" name="q1" value="wrong"> Creating databases only</label>
            </div>

            <div class="quiz-card">
                <div class="question">2. Which of the following is a Data Analytics tool?</div>
                <label class="option-label"><input type="radio" name="q2" value="correct"> Power BI</label>
                <label class="option-label"><input type="radio" name="q2" value="wrong"> MS Paint</label>
                <label class="option-label"><input type="radio" name="q2" value="wrong"> Notepad</label>
            </div>

            <button type="submit" class="submit-btn">Submit Quiz</button>
        </form>
    </div>

    <script>
        function getUserKey(baseKey) {
            const user = localStorage.getItem('currentUser') || 'guest';
            return user + '_' + baseKey;
        }

        function submitQuiz(e) {
            e.preventDefault();
            let score = 0;
            
            // Basic demo checking mechanism
            const q1 = document.querySelector('input[name="q1"]:checked');
            const q2 = document.querySelector('input[name="q2"]:checked');

            if(!q1 || !q2) {
                alert('Please answer all questions!');
                return;
            }

            if(q1.value === 'correct') score += 5;
            if(q2.value === 'correct') score += 5;

            localStorage.setItem(getUserKey('quizStatus'), 'PASS');
            localStorage.setItem(getUserKey('quizScore'), score);
            
            // Progress Calculation logic update
            let completedVideosCount = 0;
            for(let i=1; i<=4; i++) {
                if(localStorage.getItem(getUserKey('video_completed_' + i)) === 'true') {
                    completedVideosCount++;
                }
            }
            
            // Total items 5 (4 videos + 1 quiz)
            let totalPercentage = Math.round(((completedVideosCount + 1) / 5) * 100);
            localStorage.setItem(getUserKey('course_progress_percent'), totalPercentage);

            alert('Quiz submitted! Score: ' + score + '/10');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
