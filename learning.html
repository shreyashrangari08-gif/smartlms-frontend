<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { display: flex; font-family: sans-serif; margin: 0; }
        #sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        #main-content { flex-grow: 1; padding: 30px; }
        .module-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #34495e; }
        #progress-bar-container { width: 100%; background: #ddd; height: 10px; margin-bottom: 20px; }
        #progress-bar { height: 100%; background: #27ae60; width: 0%; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>Course Modules</h3>
    <div id="moduleList"></div>
    <div id="finalLink" class="module-item" onclick="loadFinal()">Final Assessment</div>
</div>

<div id="main-content">
    <div id="progress-bar-container"><div id="progress-bar"></div></div>
    <h1 id="lessonTitle">Module</h1>
    <iframe id="videoPlayer" src="" width="100%" height="400" frameborder="0"></iframe>
    <div id="quizSection"></div>
    <button id="certBtn" style="display:none;" onclick="downloadCert()">Download Certificate</button>
</div>

<script>
    let progress = localStorage.getItem('courseProgress') || 0;
    
    function updateProgress(val) {
        progress = val;
        localStorage.setItem('courseProgress', progress);
        document.getElementById('progress-bar').style.width = progress + "%";
    }

    function loadModule(index) {
        // Logic to show video and specific module quiz
        // Jab quiz submit ho, toh call karo: updateProgress(progress + 20);
    }

    function loadFinal() {
        // Final Assessment logic
        document.getElementById('quizSection').innerHTML = `
            <h3>Final Test</h3>
            <button onclick="finishCourse()">Submit Final Test</button>
        `;
    }

    function finishCourse() {
        alert("Well done! Certificate Unlocked.");
        document.getElementById('certBtn').style.display = "block";
    }

    function downloadCert() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        doc.text("Certificate of Completion", 100, 50);
        doc.save("Certificate.pdf");
    }

    updateProgress(progress);
</script>
</body>
</html>
