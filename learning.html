<script>
    // 1. Sabse upar 'courseData' wala pura object yahan rahega.

    // 2. Beech mein 'loadModule' aur 'loadFinal' functions rahenge.

    // 3. Sabse neeche ye sidebar wala code paste karo:
    const list = document.getElementById('moduleList');

    // Modules add karo
    courseData.modules.forEach((mod, index) => {
        const div = document.createElement('div');
        div.className = 'module-item';
        div.innerText = mod.title;
        div.onclick = () => loadModule(index);
        list.appendChild(div);
    });

    // Final Assessment ka button add karo
    const finalDiv = document.createElement('div');
    finalDiv.className = 'module-item';
    finalDiv.innerText = "Final Assessment";
    finalDiv.onclick = loadFinal;
    list.appendChild(finalDiv);

    // Default pehla module load karo
    loadModule(0); 
</script>
