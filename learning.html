<!DOCTYPE html>
<html>
<head>
    <style>
        body { display: flex; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #sidebar { width: 300px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        #main-content { flex-grow: 1; padding: 30px; background: #f9f9f9; }
        .content-box { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; border-left: 5px solid #3498db; }
        iframe { width: 100%; height: 400px; border-radius: 10px; }
        .quiz-box { background: #fff3cd; padding: 20px; margin-top: 20px; border-radius: 10px; }
        #certBtn { display: none; background: #27ae60; color: white; padding: 15px; border: none; cursor: pointer; border-radius: 5px; margin-top: 20px; }

    <div class="content-box">

        <ul id="takeawaysList"></ul>
    </div>

    <div class="quiz-box">
        <h3>Assessment</h3>
        <p>What is the main goal of Data Analytics?</p>
        <input type="radio" name="q1" value="wrong"> Making graphs<br>
        <input type="radio" name="q1" value="correct"> Data-driven decision making<br>
        <button onclick="checkQuiz()" style="margin-top: 10px;">Submit Answer</button>
    </div>

    <button id="certBtn" onclick="generateCertificate()">Download Certificate</button>
</div>

<script>
    function checkQuiz() {
        const correct = document.querySelector('input[value="correct"]:checked');
        if (correct) {
            alert("Correct! Certificate is now unlocked.");
            document.getElementById('certBtn').style.display = "block";
        } else {
            alert("Wrong answer, try again!");
        }

</html>
