<!DOCTYPE html>
<html>
<head>
    <style>
        .container { display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #f4f4f4; padding: 20px; border-right: 1px solid #ddd; }
        .main-content { flex: 1; padding: 40px; }
        iframe { width: 100%; height: 400px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar" id="lessonList">
        <h3>Course Lessons</h3>
        </div>
    <div class="main-content" id="viewer">
        <h1 id="title">Loading...</h1>
        <iframe id="videoPlayer" src="" frameborder="0"></iframe>
        <p id="content"></p>
        <div id="quiz"></div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');

    async function loadLearning() {
        const res = await fetch(`https://lms-backrnd.onrender.com/course/${courseId}`);
        const c = await res.json();
        
        document.getElementById('title').innerText = c.title;
        document.getElementById('videoPlayer').src = c.modules[0].videoUrl;
        document.getElementById('content').innerText = c.modules[0].content;
        
        // Quiz load karein
        document.getElementById('quiz').innerHTML = `<h3>Quiz</h3><button onclick="alert('Quiz: ${c.modules[0].quiz[0].q}')">Start Assessment</button>`;
    }
    loadLearning();
</script>
</body>
</html>
