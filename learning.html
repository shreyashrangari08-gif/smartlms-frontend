<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { display: flex; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #sidebar { width: 300px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        #main-content { flex-grow: 1; padding: 30px; background: #f9f9f9; }
        .module-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .module-item:hover { background: #34495e; }
        iframe { width: 100%; height: 450px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .content-box { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; border-left: 5px solid #3498db; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Course Modules</h2>
    <div id="moduleList"></div>
</div>

<div id="main-content">
    <h1 id="lessonTitle">Select a module to start</h1>
    <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
    <div class="content-box">
        <h3>About this Module</h3>
        <p id="lessonDescription">Select a module from the sidebar to read learning content.</p>
    </div>
</div>

<script>
    const modules = [
        { title: "Module 1: Introduction", video: "https://www.youtube.com/embed/fmpqeJA5xt4", desc: "Data analytics ke basics, analyst ka role aur data-driven decision making." },
        { title: "Module 2: SQL & Analysis", video: "https://www.youtube.com/embed/HXV3zeQKqGY", desc: "SQL ka full tutorial aur analysis techniques." },
        { title: "Module 3: Analysis Using SQL", video: "https://www.youtube.com/embed/7S_tz1z_5bA", desc: "SQL ka use karke real-world data analysis." },
        { title: "Module 4: SQL Practice", video: "https://www.youtube.com/embed/27axs9dO7AE", desc: "Beginners ke liye SQL practice aur queries." }
    ];

    function loadModule(index) {
        const mod = modules[index];
        document.getElementById('lessonTitle').innerText = mod.title;
        document.getElementById('videoPlayer').src = mod.video;
        document.getElementById('lessonDescription').innerText = mod.desc;
    }

    const list = document.getElementById('moduleList');
    modules.forEach((mod, index) => {
        const div = document.createElement('div');
        div.className = 'module-item';
        div.innerText = mod.title;
        div.onclick = () => loadModule(index);
        list.appendChild(div);
    });

    loadModule(0); // Default pehla load hoga
</script>

</body>
</html>
