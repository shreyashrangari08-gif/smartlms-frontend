<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { display: flex; font-family: sans-serif; margin: 0; }
        #sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; padding: 20px; }
        #main-content { flex-grow: 1; padding: 30px; }
        .module-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #34495e; color: white; }
        .module-item:hover { background: #34495e; }
        #videoPlayer { width: 100%; height: 400px; border-radius: 10px; }
        .content-box { background: #fff; padding: 20px; margin-top: 20px; border-radius: 10px; border-left: 5px solid #3498db; }
        #certBtn { display: none; background: #27ae60; color: white; padding: 15px; border: none; cursor: pointer; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="moduleList"></div>
</div>

<div id="main-content">
    <h1 id="lessonTitle">Welcome to the Course</h1>
    <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
    <div class="content-box" id="quizContainer">
        <div id="quizContent">Select a module to start learning.</div>
    </div>
    <button id="certBtn" onclick="generateCertificate()">Download Certificate</button>
</div>

<script>
    // 1. Data Setup
    const courseData = {
        modules: [
            { title: "Module 1: Introduction", video: "https://www.youtube.com/embed/fmpqeJA5xt4", quiz: "What is Data Analytics?" },
            { title: "Module 2: SQL & Analysis", video: "https://www.youtube.com/embed/HXV3zeQKqGY", quiz: "Is SQL used for data analysis?" },
            { title: "Module 3: Analysis Using SQL", video: "https://www.youtube.com/embed/7S_tz1z_5bA", quiz: "What is data cleaning?" },
            { title: "Module 4: SQL Practice", video: "https://www.youtube.com/embed/27axs9dO7AE", quiz: "What is SQL query?" },
            { title: "Module 5: Visualization", video: "https://www.youtube.com/embed/dQw4w9WgXcQ", quiz: "What is visualization?" }
        ]
    };

    // 2. Sidebar Load Logic
    const list = document.getElementById('moduleList');
    courseData.modules.forEach((mod, index) => {
        const div = document.createElement('div');
        div.className = 'module-item';
        div.innerText = mod.title;
        div.onclick = () => loadModule(index);
        list.appendChild(div);
    });

    // 3. Module Loader
    function loadModule(index) {
        const mod = courseData.modules[index];
        document.getElementById('lessonTitle').innerText = mod.title;
        document.getElementById('videoPlayer').src = mod.video;
        document.getElementById('quizContent').innerHTML = `
            <p>${mod.quiz}</p>
            <input type="text" id="ansInput" placeholder="Enter answer">
            <button onclick="alert('Submitted!')">Submit</button>
        `;
    }

    // 4. Final Assessment Loader
    function loadFinal() {
        document.getElementById('lessonTitle').innerText = "Final Assessment";
        document.getElementById('videoPlayer').style.display = "none";
        document.getElementById('quizContent').innerHTML = `
            <h3>Final Test (10 Questions)</h3>
            <p>1. Q1? <input type="text"></p>... <p>10. Q10? <input type="text"></p>
            <button onclick="finishCourse()">Submit Final Test</button>
        `;
    }

    function finishCourse() {
        document.getElementById('certBtn').style.display = "block";
        alert("Congratulations! Certificate Unlocked.");
    }

    function generateCertificate() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('landscape');
        doc.text("Certificate of Completion", 100, 50);
        doc.save("Certificate.pdf");
    }

    // Add Final Assessment Button to Sidebar
    const finalBtn = document.createElement('div');
    finalBtn.className = 'module-item';
    finalBtn.innerText = "Final Assessment";
    finalBtn.onclick = loadFinal;
    list.appendChild(finalBtn);

</script>
</body>
</html>
