<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        .sidebar { width: 300px; background: #f4f4f4; padding: 20px; border-right: 1px solid #ddd; }
        .main-content { flex: 1; padding: 40px; }
        iframe { width: 100%; height: 400px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="sidebar" id="lessonList"><h3>Course Lessons</h3></div>
<div class="main-content">
    <h1 id="title">Loading...</h1>
    <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
    <p id="content"></p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const courseId = urlParams.get('id');

    async function loadLearning() {
        // Backend se data mangwa rahe hain
        const res = await fetch(`https://lms-backrnd.onrender.com/course/${courseId}`);
        const c = await res.json();
        
        document.getElementById('title').innerText = c.title;
        // YouTube link ko embed format mein convert karna
        const videoId = c.modules[0].videoUrl.split('/').pop();
        document.getElementById('videoPlayer').src = `https://www.youtube.com/embed/${videoId}`;
        document.getElementById('content').innerText = c.modules[0].content;
    }
    loadLearning();
</script>
</body>
</html>
