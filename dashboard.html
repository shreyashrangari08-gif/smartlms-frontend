<div id="progressContainer" style="background: white; padding: 25px; border-radius: 12px; margin-top: 20px;">
    <h4>Learning Journey</h4>
    <div style="height: 8px; background: #e0e0e0; border-radius: 4px; margin: 20px 0;">
        <div id="dynamicBar" style="height: 100%; width: 0%; background: #00c853; border-radius: 4px; transition: 1s;"></div>
    </div>
</div>

<script>
    // Check karein kitne weeks complete huye
    let completedWeeks = 0;
    for(let i=1; i<=8; i++) {
        if(localStorage.getItem('week' + i) === 'completed') completedWeeks++;
    }
    
    // Progress bar width calculate karein
    let width = (completedWeeks / 8) * 100;
    document.getElementById('dynamicBar').style.width = width + "%";
</script>
