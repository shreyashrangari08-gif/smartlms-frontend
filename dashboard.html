<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>
<body id="dashboard-page">

    <div class="header">
        <h1>Online Learning System</h1>
    </div>
    
    <div class="course-container">
        <div class="course-box">
            <h3>Data Analytics Course</h3>
            <p style="opacity: 0.8;">Master SQL, R, and Tableau with our industry experts.</p>
            <br>
            <button class="btn-enroll" id="enroll-btn" onclick="enrollCourse()">Enroll Now</button>
            <button id="continue-btn" style="display:none; width: 100%; padding: 12px; background: #00f2fe; color: black; border: none; border-radius: 10px; font-weight: bold;" onclick="window.location.href='sqlanalysis.html'">Continue Learning</button>
        </div>
    </div>

    <script>
        function enrollCourse() {
            document.getElementById('enroll-btn').style.display = 'none';
            document.getElementById('continue-btn').style.display = 'block';
        }
    </script>
</body>
</html>
