<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>
<body id="dashboard-page">

    <div style="padding: 20px;">
        <span style="font-size:30px; cursor:pointer; color:white;" onclick="openNav()">&#9776;</span>
    </div>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="profile.html">👤 Student Profile</a>
        <a href="#">⚙️ Settings</a>
        <a href="index.html">🚪 Log Out</a>
    </div>

    <div class="header">
        <h1>Online Learning System</h1>
    </div>
    
    <div class="course-container">
        <div class="course-box">
            <h3>Data Analytics Course</h3>
            <p style="opacity: 0.8;">Master SQL, R, and Tableau.</p>
            <br>
            <button class="btn-enroll" id="enroll-btn" onclick="enrollCourse()">Enroll Now</button>
            <button id="continue-btn" style="display:none; width: 100%; padding: 12px; background: #00f2fe; color: black; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;" onclick="window.location.href='sqlanalysis.html'">Continue Learning</button>
        </div>
    </div>

    <script>
        function openNav() { document.getElementById("mySidebar").style.width = "250px"; }
        function closeNav() { document.getElementById("mySidebar").style.width = "0"; }
        function enrollCourse() {
            document.getElementById('enroll-btn').style.display = 'none';
            document.getElementById('continue-btn').style.display = 'block';
        }
    </script>
</body>
</html>
