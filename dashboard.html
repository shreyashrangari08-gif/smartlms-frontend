<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Learning System - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #1f2937;
            border-right: 1px solid #374151;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }
        .sidebar h2 {
            color: #38bdf8;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 25px;
            padding-left: 10px;
            font-weight: 600;
        }
        .sidebar a {
            color: #9ca3af;
            text-decoration: none;
            font-size: 16px;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #374151;
            color: #38bdf8;
        }
        .main-container {
            margin-left: 260px;
            flex-grow: 1;
            padding: 40px;
            background: #111827;
        }
        .header {
            border-bottom: 1px solid #374151;
            padding-bottom: 20px;
            margin-bottom: 35px;
        }
        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 28px;
        }
        .welcome-card {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }
        .welcome-card h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 22px;
        }
        .welcome-card p {
            color: #9ca3af;
            font-size: 15px;
            line-height: 1.6;
            margin: 15px 0 25px 0;
        }
        
        /* Button Styles */
        .enroll-btn {
            background-color: #2dd4bf; /* Pehle wala cyan color */
            color: #111827;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s ease;
        }
        .enroll-btn:hover {
            background-color: #14b8a6;
        }
        
        .continue-btn {
            background-color: #38bdf8; /* Blue color continue ke liye */
            color: #111827;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s ease;
        }
        .continue-btn:hover {
            background-color: #0ea5e9;
        }

        /* Status Box Styling */
        .status-box {
            display: none; 
            max-width: 500px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid #374151;
        }
        .status-box.pass {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: #10b981;
        }
        .status-box.fail {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
        }
        .status-box h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9ca3af;
            font-weight: 600;
        }
        .status-box h4 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .status-box p {
            margin: 0;
            font-size: 14px;
            color: #e5e7eb;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: relative; width: 100%; height: auto; }
            .main-container { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>LMS Panel</h2>
        <a href="dashboard.html" class="active">🏠 Dashboard</a>
        <a href="sqlanalysis.html">📚 My Courses</a>
        <a href="assessment.html">📝 Quizzes</a>
        <a href="certificate.html">🎓 Certificate</a>
        <a href="profile.html">👤 Profile</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <div class="main-container">
        <div class="header">
            <h1>Online Learning System</h1>
        </div>

        <div class="welcome-card">
            <h2>Data Analytics Course</h2>
            <p>Master SQL, R, and Tableau with industry experts to jumpstart your career in tech.</p>
            
            <div id="courseActionContainer">
                </div>
        </div>

        <div id="dashboardStatusBox" class="status-box">
            <h3>Quiz Progress</h3>
            <h4 id="statusTitle"></h4>
            <p id="statusMsg"></p>
        </div>
    </div>

    <script>
        // Function to handle enrollment click
        function enrollUser() {
            localStorage.setItem('isEnrolled', 'true');
            alert('Congratulations! Aapne course me successfully enroll kar liya hai.');
            window.location.href = 'sqlanalysis.html';
        }

        window.onload = function() {
            // 1. Enrollment Button Logic Check
            const isEnrolled = localStorage.getItem('isEnrolled');
            const actionContainer = document.getElementById('courseActionContainer');

            if (isEnrolled === 'true') {
                // Agar enroll ho chuka hai toh "Go to Course Content" / Continue Learning button dikhao
                actionContainer.innerHTML = `<a href="sqlanalysis.html" class="continue-btn">Go to Course Content</a>`;
            } else {
                // Agar enroll nahi hai toh "Enroll Now" button dikhao jo click par function trigger karega
                actionContainer.innerHTML = `<button onclick="enrollUser()" class="enroll-btn">Enroll Now</button>`;
            }

            // 2. Quiz Status Box Logic Check
            const status = localStorage.getItem('quizStatus');
            const score = localStorage.getItem('quizScore');
            const statusBox = document.getElementById('dashboardStatusBox');
            const statusTitle = document.getElementById('statusTitle');
            const statusMsg = document.getElementById('statusMsg');

            if (status) {
                statusBox.style.display = "block"; 
                
                if (status === 'PASS') {
                    statusBox.className = "status-box pass";
                    statusTitle.innerHTML = "Congratulations! 🎉";
                    statusTitle.style.color = "#10b981";
                    statusMsg.innerHTML = "Aapne Data Analytics quiz successfully clear kar liya hai! Aapka score <b>" + score + "/10</b> raha. Keep learning and shining!";
                } else {
                    statusBox.className = "status-box fail";
                    statusTitle.innerHTML = "Keep Trying! 👍";
                    statusTitle.style.color = "#ef4444";
                    statusMsg.innerHTML = "Aapka score <b>" + score + "/10</b> raha. Pass hone ke liye kam se kam 5 sahi jawab chahiye. Ek baar phir se try karein!";
                }
            }
        };
    </script>
</body>
</html>
