<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Account Settings</title>
</head>
<body id="dashboard-page" style="padding: 20px;">

    <div class="header">
        <h1>Account Settings</h1>
    </div>

    <div class="course-container" style="max-width: 800px; margin: auto; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;">
        
        <!-- Profile Section -->
        <h3>👤 Profile Settings</h3>
        <input type="text" placeholder="Full Name" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="email" placeholder="Email Address" style="width:100%; padding:10px; margin-bottom:10px;">
        <textarea placeholder="Bio/About section" style="width:100%; height:80px;"></textarea>
        
        <hr style="margin: 20px 0;">

        <!-- Security Section -->
        <h3>🔒 Account Security</h3>
        <button class="btn-enroll" style="background:#555;">Change Password</button>
        <label style="display:block; margin-top:10px;"><input type="checkbox"> Enable 2FA Authentication</label>

        <hr style="margin: 20px 0;">

        <!-- Notifications -->
        <h3>🔔 Notifications</h3>
        <label><input type="checkbox" checked> Email Notifications</label><br>
        <label><input type="checkbox"> Course Assignment Reminders</label>

        <br><br>
        <button onclick="alert('Settings Saved Successfully!')" class="btn-enroll">Save All Changes</button>
        <button onclick="window.location.href='dashboard.html'" class="btn-enroll" style="background:transparent; border:1px solid white; margin-top:10px;">Back to Dashboard</button>
    </div>

</body>
</html>
