<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #111827; color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: flex; min-height: 100vh;
        }
        .sidebar {
            width: 260px; background-color: #1f2937; border-right: 1px solid #374151;
            padding: 25px 15px; display: flex; flex-direction: column; gap: 10px;
            position: fixed; height: 100vh; left: 0; top: 0;
        }
        .sidebar h2 { color: #38bdf8; font-size: 20px; margin: 0 0 25px 0; padding-left: 10px; font-weight: 600; }
        .sidebar a {
            color: #9ca3af; text-decoration: none; font-size: 16px; padding: 12px 15px;
            border-radius: 8px; display: flex; align-items: center; gap: 10px; transition: all 0.2s ease;
        }
        .sidebar a:hover, .sidebar a.active { background-color: #374151; color: #38bdf8; }
        .main-container { margin-left: 260px; flex-grow: 1; padding: 40px; background: #111827; }
        .profile-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 30px; max-width: 500px; }
        .profile-card h2 { margin-top: 0; color: #38bdf8; margin-bottom: 20px; }
        .info-field { margin-bottom: 15px; }
        .info-field label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; }
        .info-field input { width: 100%; padding: 10px; background-color: #111827; border: 1px solid #374151; border-radius: 6px; color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>LMS Panel</h2>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="sqlanalysis.html">📚 My Courses</a>
        <a href="assessment.html">📝 Quizzes</a>
        <a href="certificate.html">🎓 Certificate</a>
        <a href="profile.html" class="active">👤 Profile</a>
        <a href="settings.html">⚙️ Settings</a>
    </div>

    <div class="main-container">
        <div class="profile-card">
            <h2>User Profile</h2>
            <div class="info-field">
                <label>Username</label>
                <input type="text" id="prof-user" readonly>
            </div>
            <div class="info-field">
                <label>Full Name</label>
                <input type="text" id="prof-name" placeholder="Not Provided" readonly>
            </div>
            <div class="info-field">
                <label>Email Address</label>
                <input type="text" id="prof-email" placeholder="Not Provided" readonly>
            </div>
        </div>
    </div>

    <script>
        function getUserKey(baseKey) {
            return (localStorage.getItem('currentUser') || 'guest') + '_' + baseKey;
        }
        window.onload = function() {
            const user = localStorage.getItem('currentUser');
            if(!user) return;
            document.getElementById('prof-user').value = user;
            document.getElementById('prof-name').value = localStorage.getItem(getUserKey('fullName')) || "";
            document.getElementById('prof-email').value = localStorage.getItem(getUserKey('email')) || "";
        };
    </script>
</body>
</html>
