<!DOCTYPE html>
<html>
<head>
    <title>Course Completion Certificate</title>
    <style>
        body { 
            background: #0b1a26; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: white; 
            font-family: Arial, sans-serif; 
            margin: 0;
        }
        canvas { 
            max-width: 90%; 
            border: 5px solid #4facfe; 
            border-radius: 10px; 
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }
        .btn-download { 
            margin-top: 25px; 
            padding: 15px 30px; 
            font-size: 18px; 
            background: #28a745; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="certCanvas" width="1000" height="700"></canvas>
    
    <button class="btn-download" onclick="downloadCert()">Download Certificate</button>

    <script>
        // Check if user is logged in
        if(!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }

        const canvas = document.getElementById('certCanvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        // Image source (Make sure this filename matches exactly with your file)
        img.src = '1000182664.png'; 
        
        img.onload = function() {
            // Draw certificate background
            ctx.drawImage(img, 0, 0, 1000, 700);
            
            // Text settings for the Name
            ctx.fillStyle = "#1a2a40"; // Dark blue text color
            ctx.font = "italic bold 60px Georgia";
            ctx.textAlign = "center";
            
            // Get Name from localStorage
            let userName = localStorage.getItem('userName') || "Student Name";
            
            // Draw the name at the center
            ctx.fillText(userName, 500, 380); 
        }

        function downloadCert() {
            const link = document.createElement('a');
            link.download = 'Data_Analytics_Certificate.png';
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
