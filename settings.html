<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #111827; color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; display: flex; min-height: 100vh;
        }
        .sidebar {
            width: 260px; background-color: #1f2937; border-right: 1px solid #374151;
            padding: 25px 15px; display: flex; flex-direction: column; gap: 10px;
            position: fixed; height: 100vh; left: 0; top: 0;
        }
        .sidebar h2 { color: #38bdf8; font-size: 20px; margin: 0 0 25px 0; padding-left: 10px; font-weight: 600; }
        .sidebar a {
            color: #9ca3af; text-decoration: none; font-size: 16px; padding: 12px 15px;
            border-radius: 8px; display: flex; align-items: center; gap: 10px; transition: all 0.2s ease;
        }
        .sidebar a:hover, .sidebar a.active { background-color: #374151; color: #38bdf8; }
        .main-container { margin-left: 260px; flex-grow: 1; padding: 40px; background: #111827; }
        .settings-card { background-color: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 30px; max-width: 500px; }
        .settings-card h2 { margin-top: 0; color: #38bdf8; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 10px; background-color: #111827; border: 1px solid #374151; border-radius: 6px; color: white; }
        .save-btn { background-color: #38bdf8; color: #111827; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>LMS Panel</h2>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="sqlanalysis.html">📚 My Courses</a>
        <a href="assessment.html">📝 Quizzes</a>
        <a href="certificate.html">🎓 Certificate</a>
        <a href="profile.html">👤 Profile</a>
        <a href="settings.html" class="active">⚙️ Settings</a>
    </div>

    <div class="main-container">
        <div class="settings-card">
            <h2>Account Settings</h2>
            <form onsubmit="saveSettings(event)">
                <div class="input-group">
                    <label>Edit Full Name</label>
                    <input type="text" id="set-name" required>
                </div>
                <div class="input-group">
                    <label>Edit Email Address</label>
                    <input type="email" id="set-email" required>
                </div>
                <button type="submit" class="save-btn">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        function getUserKey(baseKey) {
            return (localStorage.getItem('currentUser') || 'guest') + '_' + baseKey;
        }

        window.onload = function() {
            document.getElementById('set-name').value = localStorage.getItem(getUserKey('fullName')) || "";
            document.getElementById('set-email').value = localStorage.getItem(getUserKey('email')) || "";
        };

        function saveSettings(e) {
            e.preventDefault();
            const name = document.getElementById('set-name').value;
            const email = document.getElementById('set-email').value;

            localStorage.setItem(getUserKey('fullName'), name);
            localStorage.setItem(getUserKey('email'), email);

            alert('Settings Saved Successfully!');
        }
    </script>
</body>
</html>
