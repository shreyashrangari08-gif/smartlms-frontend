<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Settings</title>
</head>
<body id="dashboard-page" style="padding: 20px;">

    <div class="header">
        <h1>Settings</h1>
    </div>

    <div class="course-container" style="max-width: 600px; margin: auto; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;">
        
        <h3>👤 Profile Settings</h3>
        <input type="text" placeholder="Update Name" style="width:100%; padding:10px; margin-bottom:5px;">
        <input type="file" style="margin-bottom:10px;">
        <textarea placeholder="Bio/About" style="width:100%;"></textarea>

        <hr>

        <h3>🔒 Account Settings</h3>
        <button class="btn-enroll" style="background:#555; margin-bottom:10px;">Change Password</button>
        <label><input type="checkbox"> Two-Factor Authentication</label>

        <hr>

        <h3>🔔 Notifications</h3>
        <label><input type="checkbox" checked> Email Notifications</label><br>
        <label><input type="checkbox"> Assignment Reminders</label>

        <br><br>
        <button onclick="alert('Settings Saved!')" class="btn-enroll">Save Changes</button>
        <button onclick="window.location.href='dashboard.html'" class="btn-enroll" style="background:transparent; border:1px solid white; margin-top:10px;">Back to Dashboard</button>
    </div>

</body>
</html>
