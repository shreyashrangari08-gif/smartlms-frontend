<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Professional Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #1f2937;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 22px;
            text-align: center;
            color: #3b82f6;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #374151;
            color: white;
        }
        .main-content {
            flex: 1;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid #3b82f6;
        }
        .stat-card h3 {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="#">Dashboard</a>
        <a href="#">Manage Courses</a>
        <a href="#">Users Track</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Welcome, Shreyash!</h1>
            <p id="adminEmail" style="color: #64748b; font-weight: 500;"></p>
        </div>

        <!-- MongoDB se live data khinchne ke liye cards -->
        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Users Registered</h3>
                <p id="totalUsers">Loading...</p>
            </div>
            <div class="stat-card" style="border-top-color: #10b981;">
                <h3>Total Certificates Earned</h3>
                <p id="totalCertificates">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Purana strict/kharab email check poori tarah hata diya hai!
        // Ab ye page bina kisi restriction ke live MongoDB dashboard data dikhayega.

        async function fetchDashboardData() {
            try {
                // Aapke naye live admin route se data fetch ho raha hai
                const response = await fetch('https://lms-backrnd.onrender.com/api/admin/dashboard-data');
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('totalUsers').innerText = data.totalUsers ?? 0;
                    document.getElementById('totalCertificates').innerText = data.totalCertificates ?? 0;
                    document.getElementById('adminEmail').innerText = "Logged in as Admin";
                } else {
                    document.getElementById('totalUsers').innerText = "Error";
                    document.getElementById('totalCertificates').innerText = "Error";
                }
            } catch (err) {
                console.error("Dashboard error:", err);
                document.getElementById('totalUsers').innerText = "--";
                document.getElementById('totalCertificates').innerText = "--";
            }
        }

        function logout() {
            window.location.href = 'index.html';
        }

        // Page load hote hi data fetch karein
        window.onload = fetchDashboardData;
    </script>
</body>
</html>
