<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Secured Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; display: flex; min-height: 100vh; }
        
        /* Layout */
        #adminWrapper { display: none; width: 100%; min-height: 100vh; }
        .sidebar { width: 260px; background-color: #1f2937; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { margin-bottom: 30px; font-size: 22px; text-align: center; color: #3b82f6; }
        .sidebar a { color: #cbd5e1; text-decoration: none; padding: 12px; margin-bottom: 10px; border-radius: 6px; display: block; transition: 0.3s; cursor: pointer; }
        .sidebar a:hover { background-color: #374151; color: white; }
        .main-content { flex: 1; padding: 40px; }
        
        .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #3b82f6; }
        
        .denied-container { display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100vh; background-color: #fff1f2; color: #9f1239; }
    </style>
</head>
<body>

    <div id="deniedBlock" class="denied-container">
        <div style="padding: 30px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            🚫 Access Denied! <button onclick="window.location.href='index.html'">Login Again</button>
        </div>
    </div>

    <div id="adminWrapper">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <a href="dashboard.html">Dashboard</a>
            <a onclick="fetchStats('weekly')">Weekly Activity</a>
            <a onclick="fetchStats('monthly')">Monthly Activity</a>
            <a onclick="downloadCSV()" style="color: #10b981; font-weight: bold;">Download User CSV</a>
            <a onclick="logout()">Logout</a>
        </div>

        <div class="main-content">
            <h1 id="welcomeTitle">Welcome, Admin!</h1>
            <div class="stats-container">
                <div class="stat-card"><h3>Total Users</h3><p id="totalUsers">Loading...</p></div>
                <div class="stat-card"><h3>Total Certificates</h3><p id="totalCertificates">Loading...</p></div>
            </div>
            <div id="reportBox" class="stat-card" style="text-align: left;">
                <h3>Stats Report</h3>
                <p id="reportContent">Select a report from sidebar.</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Password Protection & Security Check
        window.onload = function() {
            const email = localStorage.getItem('roleEmail');
            if (email !== 'shreyashrangari08@gmail.com') {
                document.getElementById('deniedBlock').style.display = 'flex';
            } else {
                const pass = prompt("Enter Admin Password:");
                if (pass !== "120722") { alert("Wrong Password!"); window.location.href = 'dashboard.html'; }
                else { 
                    document.getElementById('adminWrapper').style.display = 'flex';
                    fetchDashboardData();
                }
            }
        };

        // 2. Fetch Dashboard Stats
        async function fetchDashboardData() {
            const res = await fetch('https://lms-backend.onrender.com/api/admin/dashboard-data');
            const data = await res.json();
            document.getElementById('totalUsers').innerText = data.totalUsers;
            document.getElementById('totalCertificates').innerText = data.totalCertificates;
        }

        // 3. Stats Toggle (Weekly/Monthly)
        async function fetchStats(type) {
            const res = await fetch(`https://lms-backend.onrender.com/api/admin/stats?type=${type}`);
            const data = await res.json();
            document.getElementById('reportContent').innerText = JSON.stringify(data);
        }

        // 4. Download CSV
        function downloadCSV() {
            window.location.href = 'https://lms-backend.onrender.com/api/admin/download';
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
