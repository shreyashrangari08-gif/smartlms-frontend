<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - Secured Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            min-height: 100vh;
        }
        /* Page Load Control: Shuru me sab chhupa do jab tak check na ho jaye */
        #adminWrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background-color: #1f2937;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 22px;
            text-align: center;
            color: #3b82f6;
        }
        .sidebar a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #374151;
            color: white;
        }
        .main-content {
            flex: 1;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid #3b82f6;
        }
        .stat-card h3 {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 10px;
        }
        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            color: #1e293b;
        }
        /* Error Alert Box Style */
        .denied-container {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            background-color: #fff1f2;
            color: #9f1239;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .denied-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e11d48;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Access Denied Hone Par Yeh Block Dikhega -->
    <div id="deniedBlock" class="denied-container">
        <div style="border: 2px solid #e11d48; padding: 30px; border-radius: 10px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            🚫 Access Denied! <br>
            <span style="font-size: 15px; color: #64748b; font-weight: normal; display:block; margin-top: 10px;">
                Yeh page sirf Authorized Admin ke liye secured hai.
            </span>
            <button class="denied-btn" onclick="goBack()">Go to Login Portal</button>
        </div>
    </div>

    <!-- Sahi Admin Hone Par Yeh Asli Dashboard Dikhega -->
    <div id="adminWrapper" style="display: none;">
        <div class="sidebar">
            <h2>Admin Panel</h2>
            <a href="#">Dashboard</a>
            <a href="#">Manage Courses</a>
            <a href="#">Users Track</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 id="welcomeTitle">Welcome, Admin!</h1>
                <p style="color: #10b981; font-weight: bold; background: #e6f4ea; padding: 5px 12px; border-radius: 20px; font-size: 13px;">● Verified Owner</p>
            </div>

            <!-- MongoDB Live Counting Cards -->
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Users Registered</h3>
                    <p id="totalUsers">Loading...</p>
                </div>
                <div class="stat-card" style="border-top-color: #10b981;">
                    <h3>Total Certificates Earned</h3>
                    <p id="totalCertificates">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PAGE LOAD SECURITY GUARD
        window.onload = function() {
            const currentEmail = localStorage.getItem('roleEmail');
            const currentUsername = localStorage.getItem('adminUsername') || "Admin";

            // STRICT CHECK: Agar email aapki official nahi h, toh block karo
            if (!currentEmail || currentEmail !== 'shreyashrangari08@gmail.com') {
                document.getElementById('deniedBlock').style.display = 'flex';
                document.getElementById('adminWrapper').style.display = 'none';
            } else {
                // Agar aap ho, toh content dikhao aur MongoDB data lao
                document.getElementById('deniedBlock').style.display = 'none';
                document.getElementById('adminWrapper').style.display = 'flex';
                document.getElementById('welcomeTitle').innerText = `Welcome, ${currentUsername}!`;
                fetchDashboardData();
            }
        };

        // Live MongoDB data fetcher
        async function fetchDashboardData() {
            try {
                const response = await fetch('https://lms-backrnd.onrender.com/api/admin/dashboard-data');
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('totalUsers').innerText = data.totalUsers ?? 0;
                    document.getElementById('totalCertificates').innerText = data.totalCertificates ?? 0;
                } else {
                    document.getElementById('totalUsers').innerText = "0";
                    document.getElementById('totalCertificates').innerText = "0";
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('totalUsers').innerText = "Connection Error";
                document.getElementById('totalCertificates').innerText = "Connection Error";
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        function goBack() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
