<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 40px; font-family: sans-serif; background-color: #f4f7f6;">
    <h1 style="color: #2c3e50;">Final Assessment Quiz</h1>
    <form id="quizForm">
        <!-- Questions... (Baki 10 questions yahan waise hi rahenge) -->
        <p>1. What is the main purpose of data analytics? <br>
           <input type="radio" name="q1" value="A"> A) Create games <input type="radio" name="q1" value="B"> B) Analyze data and make decisions <input type="radio" name="q1" value="C"> C) Repair computers <input type="radio" name="q1" value="D"> D) Design websites</p>
        <!-- (Baki 9 questions yahan add karein) -->

        <button type="button" onclick="calculateResult()" style="padding: 12px 25px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
            Submit Quiz
        </button>
    </form>

    <!-- Result Box (Jo quiz submit hone ke baad dikhega) -->
    <div id="resultBox" style="margin-top: 30px; padding: 25px; border-radius: 10px; display: none; text-align: center;">
        <h2 id="congratsText" style="color: #28a745;"></h2>
        <h3 id="scoreText"></h3>
        <p id="gradeText" style="font-size: 20px; font-weight: bold;"></p>
    </div>

    <script>
        function calculateResult() {
            const answers = { q1: "B", q2: "C", q3: "A", q4: "A", q5: "B", q6: "C", q7: "C", q8: "C", q9: "B", q10: "B" };
            let score = 0;
            const form = document.forms['quizForm'];
            for (let q in answers) { if (form[q].value === answers[q]) score++; }

            // Logic for Grade
            let grade, msg, color;
            if (score >= 9) { grade = "A"; msg = "Congratulations! Excellent work!"; color = "#28a745"; }
            else if (score >= 7) { grade = "B"; msg = "Well done! You performed great."; color = "#007bff"; }
            else { grade = "C"; msg = "Keep learning! You can do better."; color = "#dc3545"; }

            // Display Result
            const box = document.getElementById('resultBox');
            box.style.display = "block";
            box.style.backgroundColor = color + "22"; // Light background
            box.style.border = "2px solid " + color;
            document.getElementById('congratsText').innerText = msg;
            document.getElementById('scoreText').innerText = "Your Score: " + score + "/10";
            document.getElementById('gradeText').innerText = "Final Grade: " + grade;
        }
    </script>
</body>
</html>
