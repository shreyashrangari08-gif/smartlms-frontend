<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .login-box { border: 1px solid #ccc; padding: 30px; display: inline-block; border-radius: 10px; }
    </style>
</head>
<body>

<div id="loginSection" class="login-box">
    <h2>Login to Course</h2>
    <input type="text" id="username" placeholder="Enter your name"><br><br>
    <button onclick="login()">Start Learning</button>
</div>

<div id="dashboardSection" style="display:none;">
    <h1>My Online Learning System</h1>
    <div id="progress-container" style="width: 50%; margin: 20px auto; background: #eee; height: 20px;">
        <div id="progressBar" style="width: 0%; height: 100%; background: #27ae60;"></div>
    </div>
    <p>Progress: <span id="progressText">0</span>%</p>
    <a href="learning.html">Continue Learning</a>
</div>

<script>
    function login() {
        const name = document.getElementById('username').value;
        if(name) {
            localStorage.setItem('userName', name);
            document.getElementById('loginSection').style.display = "none";
            document.getElementById('dashboardSection').style.display = "block";
            // Progress show karo
            let prog = localStorage.getItem('courseProgress') || 0;
            document.getElementById('progressBar').style.width = prog + "%";
            document.getElementById('progressText').innerText = prog;
        } else {
            alert("Please enter a name!");
        }
    }
</script>
</body>
</html>
