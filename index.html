<div class="card" style="margin-top: 20px;">
    <h3>Add New Course</h3>
    <input type="text" id="cTitle" placeholder="Course Title">
    <input type="text" id="cDesc" placeholder="Description">
    <button onclick="addCourse()" style="background: orange;">Add Course</button>
</div>

<script>
async function addCourse() {
    const title = document.getElementById('cTitle').value;
    const description = document.getElementById('cDesc').value;
    
    await fetch('https://lms-backrnd.onrender.com/add-course', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
    });
    alert("Course Added!");
}
</script>
