<div class="login-container">
    <!-- Left Side: Brand Panel -->
    <div class="left-panel">
        <img src="your-logo.png" alt="Logo">
        <h2>Online Learning System</h2>
        <div class="slider"> <!-- Yahan tum apni images dal sakte ho --> </div>
    </div>

    <!-- Right Side: Login Form -->
    <div class="right-panel">
        <h3>Log In</h3>
        <div class="user-tabs">
            <button>As Student</button>
            <button>As T-POC/Admin/Trainer</button>
        </div>
        <div class="login-methods">
            <label><input type="radio" name="login" checked> Email</label>
            <label><input type="radio" name="login"> Mobile</label>
        </div>
        <input type="text" placeholder="Enter Mobile Number">
        <button class="otp-btn">Send OTP</button>
    </div>
</div>
