<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Learning System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <!-- Left Panel -->
            <div class="left-panel">
                <div class="logo-placeholder">LOGO</div>
                <h2>Online Learning System</h2>
                <div class="banner-image"></div>
            </div>

            <!-- Right Panel -->
            <div class="right-panel">
                <h3>Log In</h3>
                <div class="tabs">
                    <button class="active">As Student</button>
                    <button>As T-POC/Admin/Trainer</button>
                </div>
                
                <div class="radio-group">
                    <label><input type="radio" name="login" checked> Email</label>
                    <label><input type="radio" name="login"> Mobile</label>
                </div>

                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="text" placeholder="Enter Mobile Number">
                </div>

                <button class="otp-btn">Send OTP</button>
                <p class="footer-link">Problems logging in?</p>
            </div>
        </div>
    </div>

</body>
</html>
