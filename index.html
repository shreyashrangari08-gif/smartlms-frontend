<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LMS Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-container { background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); width: 100%; max-width: 420px; text-align: center; }
        .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; color: #94a3b8; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { color: #764ba2; border-bottom: 3px solid #764ba2; }
        .form-section { display: none; text-align: left; }
        .form-section.active { display: block; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; }
        input:focus { border-color: #764ba2; }
        button.submit-btn { width: 100%; padding: 12px; background: #764ba2; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button.submit-btn:hover { background: #5a3682; }
        .message { margin-top: 15px; font-size: 14px; text-align: center; font-weight: 500; }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <div id="loginSection" class="form-section active">
            <h2 style="margin-bottom: 15px; color: #1e293b;">Welcome Back</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter Username" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="name@gmail.com" required>
                </div>
                <button type="submit" class="submit-btn">Sign In</button>
            </form>
        </div>

        <div id="signupSection" class="form-section">
            <h2 style="margin-bottom: 15px; color: #1e293b;">Create Account</h2>
            <form id="signupForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="signupUsername" placeholder="Choose Username" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" placeholder="name@gmail.com" required>
                </div>
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>

        <div id="msg" class="message"></div>
    </div>

    <script>
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            document.getElementById('msg').innerText = "";
            
            if(type === 'login') {
                tabs[0].classList.add('active'); tabs[1].classList.remove('active');
                document.getElementById('loginSection').classList.add('active');
                document.getElementById('signupSection').classList.remove('active');
            } else {
                tabs[1].classList.add('active'); tabs[0].classList.remove('active');
                document.getElementById('signupSection').classList.add('active');
                document.getElementById('loginSection').classList.remove('active');
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('msg');
            try {
                const response = await fetch('https://lms-backrnd.onrender.com/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: document.getElementById('signupUsername').value.trim(), 
                        email: document.getElementById('signupEmail').value.trim().toLowerCase() 
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    msgDiv.className = "message success";
                    msgDiv.innerText = "Registration Successful! Redirecting...";
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    throw new Error(data.message || "Failed");
                }
            } catch (err) { msgDiv.className = "message error"; msgDiv.innerText = err.message; }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const msgDiv = document.getElementById('msg');

            try {
                const response = await fetch('https://lms-backrnd.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });
                const data = await response.json();
                if (response.ok) {
                    msgDiv.className = "message success";
                    msgDiv.innerText = "Login Successful!";
                    localStorage.setItem('currentUser', username);
                    window.location.href = 'dashboard.html';
                } else {
                    throw new Error(data.message || "Invalid credentials.");
                }
            } catch (err) { msgDiv.className = "message error"; msgDiv.innerText = err.message; }
        });
    </script>
</body>
</html>
