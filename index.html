<div class="right-panel">
    <h3>Log In</h3>
    <!-- Login Form -->
    <div id="login-form">
        <input type="email" id="email" value="shreyashrangari08@gmail.com" placeholder="Email">
        <input type="password" id="password" value="Shreyash123" placeholder="Password">
        <button class="otp-btn" onclick="checkLogin()">Log In</button>

        <p onclick="showLogin()" style="cursor:pointer; color:#007bff;">Back to Login</p>
    </div>
</div>
