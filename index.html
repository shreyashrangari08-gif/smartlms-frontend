<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LMS - Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: #333;
        }
        p {
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input:focus {
            border-color: #764ba2;
            box-shadow: 0 0 5px rgba(118, 75, 162, 0.3);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #764ba2;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #5a3682;
        }
        .message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Smart LMS Portal</h2>
        <p>Sign in to access your dashboard</p>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Username (e.g. Shreyash123)" required>
            </div>
            
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@gmail.com" required>
            </div>
            
            <button type="submit">Sign In</button>
        </form>
        
        <div id="msg" class="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase(); // Sab small letters me convert karega
            const msgDiv = document.getElementById('msg');
            
            msgDiv.className = "message";
            msgDiv.innerText = "Connecting to database...";

            try {
                const response = await fetch('https://lms-backrnd.onrender.com/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email })
                });

                const data = await response.json();

                if (response.ok) {
                    msgDiv.className = "message success";
                    msgDiv.innerText = "Login Successful! Redirecting...";
                    
                    // Browser me email save kar rahe hain check karne ke liye
                    localStorage.setItem('roleEmail', email);
                    localStorage.setItem('adminUsername', username);

                    // ROLE ACCESS CHECK LOGIC
                    setTimeout(() => {
                        if (email === 'shreyashrangari08@gmail.com') {
                            // Agar aapki mail h, toh Admin Panel
                            window.location.href = 'admin.html';
                        } else {
                            // Agar doosri mail h, toh Normal Student Dashboard
                            window.location.href = 'dashboard.html';
                        }
                    }, 1500);
                } else {
                    msgDiv.className = "message error";
                    msgDiv.innerText = data.message || "Invalid credentials. Register first!";
                }
            } catch (err) {
                console.error(err);
                msgDiv.className = "message error";
                msgDiv.innerText = "Server error! Make sure Render is live.";
            }
        });
    </script>
</body>
</html>
