<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { display: flex; width: 600px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .left-side { background-color: #007bff; color: white; padding: 40px; flex: 1; text-align: center; }
        .right-side { padding: 40px; flex: 1; }
        input { width: 100%; margin-bottom: 15px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="left-side">
            <h2>OLS</h2>
            <p>Online Learning System</p>
        </div>
        <div class="right-side">
            <h2>Log In</h2>
            <form onsubmit="handleLogin(event)">
                <label>Email:</label>
                <input type="email" id="email" required>
                <label>Password:</label>
                <input type="password" id="password" required>
                <button type="submit">Log In</button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (email === "shreyashrangari08@gmail.com" && password === "Shreyash123") {
                window.location.href = "learning.html";
            } else {
                alert("Invalid Credentials!");
            }
        }
    </script>
</body>
</html>
