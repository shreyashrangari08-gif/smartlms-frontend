<!DOCTYPE html>
<html>
<body style="background:#0b1a26; font-family:sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div style="background:white; padding:30px; border-radius:10px; width:300px; text-align:center;">
        <h2 id="title">Login</h2>
        <input type="text" id="name" placeholder="Full Name (for Signup)" style="width:90%; padding:10px; margin:5px;">
        <input type="email" id="email" placeholder="Email" style="width:90%; padding:10px; margin:5px;">
        <input type="password" id="pass" placeholder="Password" style="width:90%; padding:10px; margin:5px;">
        <button id="btn" onclick="auth()" style="width:95%; padding:10px; background:#007bff; color:white; border:none; cursor:pointer;">Login</button>
        <p id="toggle" onclick="toggleMode()" style="color:blue; cursor:pointer; font-size:14px; margin-top:10px;">New user? Sign Up</p>
    </div>
    <script>
        let isSignup = false;
        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('title').innerText = isSignup ? "Sign Up" : "Login";
            document.getElementById('btn').innerText = isSignup ? "Sign Up" : "Login";
            document.getElementById('toggle').innerText = isSignup ? "Already have account? Login" : "New user? Sign Up";
        }
        function auth() {
            let e = document.getElementById('email').value;
            let p = document.getElementById('pass').value;
            let n = document.getElementById('name').value;
            if(isSignup) {
                localStorage.setItem(e+"_pass", p);
                localStorage.setItem(e+"_name", n);
                alert("Signup Success!"); toggleMode();
            } else {
                if(localStorage.getItem(e+"_pass") === p) {
                    localStorage.setItem('user', e);
                    localStorage.setItem('userName', localStorage.getItem(e+"_name"));
                    window.location.href = 'sqlanalysis.html';
                } else { alert("Wrong credentials!"); }
            }
        }
    </script>
</body>
</html>
