<!DOCTYPE html>
<html>
<head>
    <style>
        .header { background: #003366; color: white; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header"><h1>INFOSYS & GLOBAL CAREER LIBRARY</h1></div>
<div class="grid" id="courseList">Loading courses...</div>

<script>
    async function loadCourses() {
        const response = await fetch('https://lms-backrnd.onrender.com/courses');
        const courses = await response.json();
        
        const container = document.getElementById('courseList');
        container.innerHTML = courses.map(c => `
            <div class="card">
                <h3>${c.title}</h3>
                <p>${c.description || 'No description available'}</p>
                <button class="btn" onclick="startLearning('${c._id}')">Start Learning</button>
            </div>
        `).join('');
    }

    function startLearning(courseId) {
        // Yahan hum naya learning page kholenge
        window.location.href = `learning.html?id=${courseId}`;
    }

    loadCourses();
</script>
</body>
</html>
