<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0b1a26; color: white; height: 100vh; display: flex; flex-direction: column; }
        .header-bar { padding: 15px; background: #1c2e3d; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4facfe; }
        .main-container { display: flex; flex-grow: 1; }
        .sidebar { width: 280px; background: #1c2e3d; padding: 20px; display: none; border-right: 1px solid #4facfe; }
        .content { flex-grow: 1; padding: 40px; }
        .dash-card { background: #1c2e3d; padding: 30px; border-radius: 15px; border: 1px solid #4facfe; width: 300px; }
        .link { color: #4facfe; cursor: pointer; display: block; margin: 15px 0; font-weight: bold; }
        iframe { width: 100%; height: 400px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div></div>
        <h2 style="margin:0;">Online Learning System</h2>
        <div style="cursor:pointer; font-size:24px;" onclick="openSettings()">⋮</div>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <h3>Course Content</h3>
            <span class="link" onclick="loadContent('Introduction', 'yZvFH7B6gKI')">1. Introduction</span>
            <span class="link" onclick="loadContent('Environment', 'hiS_mWZmmI0')">2. Environment</span>
            <span class="link" onclick="loadContent('SQL Queries', 'kbKty5ZVKMY')">3. SQL Queries</span>
            <span class="link" onclick="loadContent('Visualization', 'MiiANxRHSv4')">4. Visualization</span>
            <hr>
            <a class="link" href="assessment.html">🚀 Take Quiz</a>
            <button onclick="goHome()" style="background:none; border:none; color:white; cursor:pointer; font-weight:bold;">🏠 Back to Dashboard</button>
        </div>
        
        <div class="content" id="main">
            <div id="dashboard-view" class="dash-card">
                <h3>Data Analytics Course</h3>
                <p>Master SQL, R, and Tableau.</p>
                <button id="enroll-btn" onclick="startCourse()">Enroll Now</button>
            </div>
            <div id="content-view" style="display:none; width: 80%;">
                <h2 id="header"></h2>
                <div id="video-box"></div>
            </div>
        </div>
    </div>

    <script>
        // Refresh par state retain karne ke liye
        window.onload = () => {
            if(localStorage.getItem('inCourse') === 'true') startCourse();
        };

        function startCourse() {
            document.getElementById('enroll-btn').innerText = "Continue Learning";
            document.getElementById('sidebar').style.display = 'block';
            localStorage.setItem('inCourse', 'true');
            loadContent('Introduction', 'yZvFH7B6gKI');
        }

        function goHome() {
            document.getElementById('dashboard-view').style.display = 'block';
            document.getElementById('content-view').style.display = 'none';
            document.getElementById('sidebar').style.display = 'none';
            localStorage.setItem('inCourse', 'false');
        }

        function loadContent(title, vidId) {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('content-view').style.display = 'block';
            document.getElementById('header').innerText = title;
            document.getElementById('video-box').innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}"></iframe>`;
        }

        function openSettings() {
            let name = prompt("Edit Name:", localStorage.getItem('userName') || "Shreyash");
            if(name) localStorage.setItem('userName', name);
            alert("Settings Saved!\nName: " + localStorage.getItem('userName') + "\nEmail: shreyashrangari08@gmail.com");
        }
    </script>
</body>
</html>
