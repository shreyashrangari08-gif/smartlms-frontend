<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; display: flex; font-family: sans-serif; background: #0b1a26; color: white; height: 100vh; }
        .sidebar { width: 280px; background: #1c2e3d; padding: 20px; border-right: 2px solid #4facfe; display: none; } /* Sidebar hidden by default */
        .content { flex-grow: 1; padding: 40px; }
        .dash-card { background: #1c2e3d; padding: 30px; border-radius: 15px; border: 1px solid #4facfe; width: 300px; }
        .link { color: #4facfe; cursor: pointer; display: block; margin: 15px 0; font-weight: bold; text-decoration: none; }
        iframe { width: 100%; height: 400px; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h3>Course Content</h3>
        <span class="link" onclick="loadContent('Introduction', 'yZvFH7B6gKI')">1. Introduction</span>
        <span class="link" onclick="loadContent('Environment', 'hiS_mWZmmI0')">2. Environment</span>
        <span class="link" onclick="loadContent('SQL Queries', 'kbKty5ZVKMY')">3. SQL Queries</span>
        <span class="link" onclick="loadContent('Visualization', 'MiiANxRHSv4')">4. Visualization</span>
        <hr>
        <a class="link" href="assessment.html">🚀 Take Quiz</a>
        <a class="link" href="certificate.html">Get Certificate</a>
    </div>
    
    <div class="content" id="main">
        <div id="dashboard-view">
            <h1>Online Learning System</h1>
            <div class="dash-card">
                <h3>Data Analytics Course</h3>
                <p>Master SQL, R, and Tableau.</p>
                <button id="enroll-btn" onclick="startCourse()" style="padding:10px 20px; cursor:pointer;">Enroll Now</button>
            </div>
        </div>
        <div id="content-view" style="display:none;">
            <h2 id="header">Introduction</h2>
            <div id="video-box"></div>
        </div>
    </div>

    <script>
        function startCourse() {
            // Button badal kar "Continue Learning" kar diya
            document.getElementById('enroll-btn').innerText = "Continue Learning";
            // Sidebar dikha diya
            document.getElementById('sidebar').style.display = 'block';
            // Pehla content load kiya
            loadContent('Introduction', 'yZvFH7B6gKI');
        }

        function loadContent(title, vidId) {
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('content-view').style.display = 'block';
            document.getElementById('header').innerText = title;
            document.getElementById('video-box').innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}"></iframe>`;
        }
    </script>
</body>
</html>
