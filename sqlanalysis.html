<!DOCTYPE html>
<html>
<head>
    <title>Course Content</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #0b1a26; color: white; }
        .container { display: flex; gap: 20px; }
        .sidebar { width: 250px; background: #1c2e3d; padding: 15px; border-radius: 10px; }
        .content { flex-grow: 1; padding: 20px; }
        .lesson-link { cursor: pointer; color: #4facfe; margin: 10px 0; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Course Content</h3>
            <span class="lesson-link" onclick="show('data')">1. Introduction</span>
            <span class="lesson-link" onclick="show('env')">2. Environment</span>
            <span class="lesson-link" onclick="show('sql')">3. SQL Queries</span>
            <span class="lesson-link" onclick="show('viz')">4. Visualization</span>
            <hr>
            <span class="lesson-link" onclick="window.location.href='assessment.html'">🚀 Take Quiz</span>
            <div id="cert-area"></div>
        </div>
        <div class="content" id="main-content"><h2>Welcome!</h2></div>
    </div>
    <script>
        function show(id) {
            const content = {
                'data': '<h2>Introduction</h2><iframe width="100%" height="315" src="https://www.youtube.com/embed/yZvFH7B6gKI"></iframe>',
                'env': '<h2>Environment</h2><iframe width="100%" height="315" src="https://www.youtube.com/embed/hiS_mWZmmI0"></iframe>',
                'sql': '<h2>SQL Queries</h2><iframe width="100%" height="315" src="https://www.youtube.com/embed/kbKty5ZVKMY"></iframe>',
                'viz': '<h2>Visualization</h2><iframe width="100%" height="315" src="https://www.youtube.com/embed/MiiANxRHSv4"></iframe>'
            };
            document.getElementById('main-content').innerHTML = content[id];
        }
        if(localStorage.getItem('currentUser')) {
            document.getElementById('cert-area').innerHTML = '<a href="certificate.html" style="color:yellow;">Get Certificate</a>';
        }
    </script>
</body>
</html>
