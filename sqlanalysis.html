<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; padding: 15px 40px; background: #1e293b; border-bottom: 2px solid #38bdf8; }
        
        /* Layout */
        .main-wrapper { display: flex; flex-grow: 1; overflow: hidden; }
        .sidebar-nav { width: 250px; background: #1e293b; padding: 20px; border-right: 1px solid #334155; }
        .content-area { flex-grow: 1; padding: 30px; overflow-y: auto; }
        
        /* Sections */
        .section { display: none; }
        .active { display: block; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #38bdf8; }
        
        .nav-link { cursor: pointer; display: block; padding: 10px; color: #94a3b8; }
        .nav-link:hover { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="navbar">
        <div><strong>LMS Logo</strong></div>
        <div style="cursor:pointer;" onclick="showSection('settings')">Notifications 🔔 | Profile ⚙️</div>
    </div>

    <div class="main-wrapper">
        <div class="sidebar-nav">
            <h3 style="color:#38bdf8;">Navigation</h3>
            <div class="nav-link" onclick="showSection('dashboard')">🏠 Dashboard</div>
            <div class="nav-link" onclick="showSection('courses')">📚 My Courses</div>
            <div class="nav-link" onclick="showSection('certs')">🎓 Certificates</div>
        </div>

        <div class="content-area">
            
            <div id="dashboard" class="section active">
                <h1 style="text-align:center;">ONLINE LEARNING SYSTEM</h1>
                <p style="text-align:center;">Learn. Practice. Get Certified.</p>
                <div class="card"><h3>📊 Stats:</h3><p>Active: 03 | Completed: 02</p></div>
                <div class="card"><h3>🕒 Recent Activity:</h3><p>Last watched: Data Analytics Intro</p></div>
            </div>

            <div id="courses" class="section">
                <h2>My Courses</h2>
                <div class="card">
                    <h3>Data Analytics</h3>
                    <button onclick="playVideo()">Continue Learning</button>
                    <div id="video-box" style="margin-top:20px;"></div>
                </div>
            </div>

            <div id="settings" class="section">
                <h2>Account Settings</h2>
                <input type="text" placeholder="Update Name" style="padding:10px; width:100%;">
                <button onclick="showSection('dashboard')">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        function playVideo() {
            document.getElementById('video-box').innerHTML = 
                '<iframe width="100%" height="300" src="https://www.youtube.com/embed/yZvFH7B6gKI"></iframe>';
        }
    </script>
</body>
</html>
