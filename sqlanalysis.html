<!DOCTYPE html>
<html>
<head>
    <title>Data Analytics Course</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #0b1a26; color: white; }
        .course-container { display: flex; gap: 25px; width: 100%; height: 85vh; }
        .sidebar { width: 25%; min-width: 280px; padding: 20px; background: rgba(0,0,0,0.3); border: 1px solid #4facfe; border-radius: 10px; }
        .content-area { width: 75%; padding: 40px; background: rgba(0,0,0,0.5); border: 1px solid #4facfe; border-radius: 10px; }
        .lesson-link { cursor: pointer; color: #4facfe; margin-bottom: 15px; font-weight: bold; }
        .btn-done { background: #28a745; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-top: 15px; border-radius: 5px; }
        .progress-bar-bg { width: 100%; background: #222; height: 15px; border-radius: 10px; margin: 10px 0; border: 1px solid #4facfe; }
        .progress-bar-fill { height: 100%; background: #28a745; width: 0%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="course-container">
        <div class="sidebar">
            <h3>Course Content</h3>
            <ul style="list-style: none; padding: 0;">
                <li class="lesson-link" onclick="showContent('welcome')">• Home</li>
                <li class="lesson-link" onclick="showContent('data')">• Introduction to Data</li>
                <li class="lesson-link" onclick="showContent('env')">• Setting up Environment</li>
                <li class="lesson-link" onclick="showContent('sql')">• Queries & Filters</li>
                <li class="lesson-link" onclick="showContent('viz')">• Data Visualization</li>
                <li class="lesson-link" onclick="showContent('mod4')">• Data Cleaning</li>
            </ul>
            <div id="cert-section" style="margin-top: 20px; border-top: 1px solid #444; padding-top: 10px;">
                <strong>Progress:</strong>
                <div class="progress-bar-bg"><div id="main-progress" class="progress-bar-fill"></div></div>
            </div>
        </div>
        <div class="content-area" id="content-area"><h2>Welcome <span id="displayName"></span>!</h2></div>
    </div>
    <script>
        let currentUser = localStorage.getItem('currentUser');
        if(!currentUser) { window.location.href = 'login.html'; }
        document.getElementById('displayName').innerText = localStorage.getItem('userName');
        let progress = JSON.parse(localStorage.getItem(currentUser + '_prog')) || { data:0, env:0, sql:0, viz:0, mod4:0 };
        function getProgress() { return Object.values(progress).reduce((a, b) => a + b, 0); }
        function updateUI() { 
            document.getElementById('main-progress').style.width = getProgress() + "%";
            let certSection = document.getElementById('cert-section');
            if (getProgress() >= 100 && !document.getElementById('cert-link')) {
                certSection.innerHTML += `<div id="cert-link" style="background:#28a745; margin-top:10px; padding:10px; border-radius:5px;"><a href="certificate.html" style="color:white; text-decoration:none;">Get Certificate</a></div>`;
            }
        }
        function markDone(id) { progress[id] = 20; localStorage.setItem(currentUser + '_prog', JSON.stringify(progress)); updateUI(); alert("Module Completed!"); }
        const content = {
            'welcome': `<h2>Welcome!</h2>`,
            'data': `<h2>1. Introduction</h2><button class="btn-done" onclick="markDone('data')">Mark as Done</button>`,
            'env': `<h2>2. Environment Setup</h2><button class="btn-done" onclick="markDone('env')">Mark as Done</button>`,
            'sql': `<h2>3. SQL Queries</h2><button class="btn-done" onclick="markDone('sql')">Mark as Done</button>`,
            'viz': `<h2>4. Visualization</h2><button class="btn-done" onclick="markDone('viz')">Mark as Done</button>`,
            'mod4': `<h2>5. Data Cleaning</h2><button class="btn-done" onclick="markDone('mod4')">Mark as Done</button>`
        };
        function showContent(id) { document.getElementById('content-area').innerHTML = content[id]; }
        updateUI();
    </script>
</body>
</html>
