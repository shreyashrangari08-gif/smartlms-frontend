<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b1120; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #111827; padding: 20px; border-right: 1px solid #1e293b; }
        .content { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .card { background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #38bdf8; }
        .btn { padding: 10px 15px; background: #38bdf8; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .progress-bar { height: 10px; background: #334155; border-radius: 5px; margin: 10px 0; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; border-radius: 5px; transition: 0.5s; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div onclick="show('dashboard')" style="cursor:pointer; padding:10px;">🏠 Dashboard</div>
        <div onclick="show('my-courses')" style="cursor:pointer; padding:10px;">📚 My Courses</div>
        <div onclick="show('quiz-section')" style="cursor:pointer; padding:10px;">📝 Quizzes</div>
        <div onclick="show('cert-section')" style="cursor:pointer; padding:10px;">🏆 Certificate</div>
    </div>

    <div class="content">
        <div id="dashboard" class="section">
            <h1>Dashboard</h1>
            <div class="card">
                <h3>Overall Progress</h3>
                <div class="progress-bar"><div id="main-progress" class="progress-fill"></div></div>
                <p id="progress-text">0% Completed</p>
            </div>
        </div>

        <div id="my-courses" class="section hidden">
            <h2>Data Analytics Masterclass</h2>
            <div id="modules-list">
                </div>
        </div>

        <div id="quiz-section" class="section hidden">
            <h2>Course Quizzes</h2>
            <div class="card">
                <p>Quiz 1-12 available now.</p>
                <button class="btn" onclick="alert('Starting Quiz...')">Start Quizzes</button>
            </div>
            <div class="card"><h3>Your Grades: 85%</h3></div>
        </div>

        <div id="cert-section" class="section hidden">
            <h2>Your Certificate</h2>
            <div class="card"><img src="1000182664.png" style="width:100%; border-radius:8px;"></div>
        </div>
    </div>

    <script>
        let completed = JSON.parse(localStorage.getItem('completed')) || [];
        const modules = ["Intro to SQL", "Data Cleaning", "Advanced Joins", "Python Viz", "Capstone"];

        function show(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function renderModules() {
            let list = document.getElementById('modules-list');
            list.innerHTML = '';
            modules.forEach((m, i) => {
                let isDone = completed.includes(i);
                list.innerHTML += `<div class="card">
                    <h3>${m}</h3>
                    <button class="btn" onclick="markDone(${i})">${isDone ? '✅ Completed' : 'Mark as Complete'}</button>
                </div>`;
            });
            updateProgress();
        }

        function markDone(i) {
            if(!completed.includes(i)) completed.push(i);
            localStorage.setItem('completed', JSON.stringify(completed));
            renderModules();
        }

        function updateProgress() {
            let p = (completed.length / modules.length) * 100;
            document.getElementById('main-progress').style.width = p + '%';
            document.getElementById('progress-text').innerText = p + '% Completed';
        }

        renderModules();
    </script>
</body>
</html>
