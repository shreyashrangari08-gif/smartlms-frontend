<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* Professional Deep Dark Theme */
        body { margin: 0; font-family: 'Inter', sans-serif; background: #0b1120; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        .navbar { display: flex; justify-content: space-between; padding: 15px 40px; background: #111827; border-bottom: 1px solid #1e293b; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        .main-wrapper { display: flex; flex-grow: 1; overflow: hidden; }
        .sidebar { width: 260px; background: #111827; padding: 20px; border-right: 1px solid #1e293b; }
        .content-area { flex-grow: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #0b1120); }
        
        .section { display: none; }
        .active { display: block; }
        
        /* Modern Cards */
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 25px; border-radius: 16px; border: 1px solid rgba(56, 189, 248, 0.2); margin-bottom: 20px; transition: 0.3s; }
        .card:hover { border-color: #38bdf8; }
        
        .nav-link { cursor: pointer; padding: 12px; margin-bottom: 5px; color: #94a3b8; display: block; border-radius: 8px; font-weight: 500; }
        .nav-link:hover { color: #38bdf8; background: #1e293b; }
        
        .btn { padding: 12px 24px; background: #38bdf8; border: none; cursor: pointer; border-radius: 8px; color: #0b1120; font-weight: 600; }
        .btn:hover { background: #7dd3fc; }
    </style>
</head>
<body>

    <div class="navbar">
        <div><strong>LMS Learning</strong></div>
        <div style="cursor:pointer;" onclick="showSection('settings-menu')">Notifications 🔔 | Profile ⚙️</div>
    </div>

    <div class="main-wrapper">
        <div class="sidebar">
            <div class="nav-link" onclick="showSection('dashboard')">🏠 Dashboard</div>
            <div class="nav-link" onclick="showSection('my-courses')">📚 My Courses</div>
            <div class="nav-link" onclick="showSection('settings-menu')">⚙️ Settings</div>
        </div>

        <div class="content-area">
            <div id="dashboard" class="section active">
                <h1>Dashboard</h1>
                <div class="card"><h3>📊 System Overview</h3><p>Active Courses: 03 | Completed: 02</p></div>
            </div>

            <div id="my-courses" class="section">
                <h2>📚 My Courses</h2>
                <div class="card">
                    <h3>Data Analytics Masterclass</h3>
                    <p>Status: In Progress</p>
                    <button class="btn" onclick="alert('Starting Course...')">Continue Learning</button>
                </div>
            </div>

            <div id="settings-menu" class="section">
                <h2>⚙️ Settings</h2>
                <div class="card" onclick="showSection('profile-edit')">👤 Profile Settings</div>
            </div>
        </div>
    </div>

    <script>
        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
