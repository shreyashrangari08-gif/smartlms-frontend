<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; padding: 0; display: flex; font-family: sans-serif; background: #0b1a26; color: white; height: 100vh; }
        .sidebar { width: 280px; background: #1c2e3d; padding: 20px; border-right: 1px solid #4facfe; }
        .content { flex-grow: 1; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .link { color: #4facfe; cursor: pointer; display: block; margin: 15px 0; font-weight: bold; text-decoration: none; }
        .progress-bar-bg { width: 100%; background: #222; height: 15px; border-radius: 10px; margin: 10px 0; border: 1px solid #4facfe; }
        .progress-bar-fill { height: 100%; background: #28a745; width: 0%; border-radius: 10px; transition: 0.5s; }
        iframe { width: 80%; height: 400px; border-radius: 10px; border: 2px solid white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Course Content</h3>
        <span class="link" onclick="loadVideo('yZvFH7B6gKI')">1. Introduction</span>
        <span class="link" onclick="loadVideo('hiS_mWZmmI0')">2. Environment</span>
        <span class="link" onclick="loadVideo('kbKty5ZVKMY')">3. SQL Queries</span>
        <span class="link" onclick="loadVideo('MiiANxRHSv4')">4. Visualization</span>
        <hr>
        <a class="link" style="color:yellow;" href="assessment.html">🚀 Take Quiz</a>
        <a class="link" style="color:green;" href="certificate.html">Get Certificate</a>
        <p>Progress:</p>
        <div class="progress-bar-bg"><div id="main-progress" class="progress-bar-fill"></div></div>
    </div>
    
    <div class="content" id="main">
        <h2 id="title">Welcome! Select a module from the sidebar.</h2>
        <div id="video-container"></div>
        <button id="done-btn" style="display:none; margin-top:20px; padding:10px 20px;" onclick="markDone()">Mark as Done</button>
    </div>

    <script>
        function loadVideo(id) {
            document.getElementById('title').innerText = "Module Content";
            document.getElementById('video-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}"></iframe>`;
            document.getElementById('done-btn').style.display = 'block';
        }
        function markDone() {
            let prog = document.getElementById('main-progress');
            let currentWidth = parseInt(prog.style.width) || 0;
            if(currentWidth < 100) {
                prog.style.width = (currentWidth + 25) + "%";
            }
            alert("Module Marked Done!");
        }
    </script>
</body>
</html>
