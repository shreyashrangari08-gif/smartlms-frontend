<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b1120; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #111827; padding: 20px; border-right: 1px solid #1e293b; }
        .content { flex-grow: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top right, #1e293b, #0b1120); }
        .card { background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #38bdf8; }
        .btn { padding: 10px 20px; background: #38bdf8; border: none; cursor: pointer; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .progress-bar { height: 10px; background: #334155; border-radius: 5px; margin: 10px 0; }
        .progress-fill { height: 100%; background: #10b981; width: 0%; border-radius: 5px; }
        .nav-item { padding: 12px; cursor: pointer; color: #94a3b8; }
        .nav-item:hover { color: #38bdf8; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="nav-item" onclick="show('dashboard')">🏠 Dashboard</div>
        <div class="nav-item" onclick="show('my-courses')">📚 My Courses</div>
        <div class="nav-item" onclick="show('quiz-section')">📝 Quizzes</div>
        <div class="nav-item" onclick="show('cert-section')">🏆 Certificate</div>
    </div>

    <div class="content">
        <div id="dashboard" class="section">
            <h1>Welcome, Student!</h1>
            <div class="card">
                <h3>Overall Course Progress</h3>
                <div class="progress-bar"><div id="main-progress" class="progress-fill"></div></div>
                <p id="progress-text">0% Completed</p>
            </div>
        </div>

        <div id="my-courses" class="section hidden">
            <h2>Course Modules</h2>
            <div id="modules-list"></div>
        </div>

        <div id="quiz-section" class="section hidden">
            <h2>Course Quizzes</h2>
            <div class="card">
                <p>12 Quizzes available (1-12).</p>
                <button class="btn" onclick="alert('Starting Quiz 1 of 12...')">Start Quizzes</button>
            </div>
            <div class="card"><h3>Current Grade: 85%</h3></div>
        </div>

        <div id="cert-section" class="section hidden">
            <h2>Your Certificate</h2>
            <div class="card"><img src="1000182664.png" style="width:100%; border-radius:8px;"></div>
        </div>
    </div>

    <script>
        let completed = JSON.parse(localStorage.getItem('completed')) || [];
        const modules = ["Intro to SQL", "Data Cleaning", "Advanced Joins", "Python Viz", "Capstone Project"];

        function show(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            localStorage.setItem('lastPage', id);
        }

        function renderModules() {
            let list = document.getElementById('modules-list');
            list.innerHTML = '';
            modules.forEach((m, i) => {
                let isDone = completed.includes(i);
                list.innerHTML += `<div class="card">
                    <h3>${m}</h3>
                    <iframe width="100%" height="200" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
                    <br><button class="btn" onclick="markDone(${i})" ${isDone ? 'disabled' : ''}>
                        ${isDone ? '✅ Completed' : 'Mark as Complete'}
                    </button>
                </div>`;
            });
            updateProgress();
        }

        function markDone(i) {
            if(!completed.includes(i)) completed.push(i);
            localStorage.setItem('completed', JSON.stringify(completed));
            renderModules();
        }

        function updateProgress() {
            let p = (completed.length / modules.length) * 100;
            document.getElementById('main-progress').style.width = p + '%';
            document.getElementById('progress-text').innerText = p + '% Completed';
        }

        // Initialize
        window.onload = () => {
            show(localStorage.getItem('lastPage') || 'dashboard');
            renderModules();
        };
    </script>
</body>
</html>
