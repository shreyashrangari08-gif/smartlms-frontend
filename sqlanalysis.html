<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin:0; padding:20px; font-family:sans-serif; background:#0b1a26; color:white; display:flex; gap:20px; }
        .sidebar { width:250px; background:#1c2e3d; padding:20px; border-radius:10px; }
        .content { flex-grow:1; background:rgba(0,0,0,0.5); padding:20px; border-radius:10px; }
        .link { color:#4facfe; cursor:pointer; display:block; margin:10px 0; font-weight:bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Course Content</h3>
        <span class="link" onclick="load('data')">1. Introduction</span>
        <span class="link" onclick="load('env')">2. Environment</span>
        <span class="link" onclick="load('sql')">3. SQL Queries</span>
        <span class="link" onclick="load('viz')">4. Visualization</span>
        <hr>
        <div id="cert-box"></div>
        <p>Progress: <progress id="prog" value="0" max="100"></progress></p>
    </div>
    <div class="content" id="main"><h2>Welcome! Select a module.</h2></div>
    <script>
        function load(id) {
            const vids = { 'data': 'yZvFH7B6gKI', 'env': 'hiS_mWZmmI0', 'sql': 'kbKty5ZVKMY', 'viz': 'MiiANxRHSv4' };
            document.getElementById('main').innerHTML = `<h2>Module</h2><iframe width="100%" height="400" src="https://www.youtube.com/embed/${vids[id]}"></iframe><br><button onclick="done()">Mark as Done</button>`;
        }
        function done() { document.getElementById('prog').value += 25; if(document.getElementById('prog').value >= 100) document.getElementById('cert-box').innerHTML = '<a href="certificate.html" style="color:yellow;">Get Certificate</a>'; }
    </script>
</body>
</html>
