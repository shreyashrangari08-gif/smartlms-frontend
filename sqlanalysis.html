<!DOCTYPE html>
<html>
<head>
    <title>Data Analytics Course</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #0b1a26; color: white; }
        .course-container { display: flex; gap: 25px; width: 100%; height: 90vh; }
        .sidebar { width: 300px; padding: 20px; background: rgba(0,0,0,0.3); border: 1px solid #4facfe; border-radius: 10px; }
        .content-area { flex-grow: 1; padding: 40px; background: rgba(0,0,0,0.5); border: 1px solid #4facfe; border-radius: 10px; overflow-y: auto; }
        .lesson-link { cursor: pointer; color: #4facfe; margin-bottom: 15px; font-weight: bold; }
        .btn-done { background: #28a745; color: white; padding: 10px 20px; border: none; cursor: pointer; margin-top: 15px; }
        .progress-bar-bg { width: 100%; background: #222; height: 15px; border-radius: 10px; border: 1px solid #4facfe; }
        .progress-bar-fill { height: 100%; background: #28a745; width: 0%; border-radius: 10px; transition: 0.5s; }
    </style>
</head>
<body>
    <div class="course-container">
        <div class="sidebar">
            <h3>Course Content</h3>
            <ul style="list-style: none; padding: 0;">
                <li class="lesson-link" onclick="showContent('data')">• Introduction</li>
                <li class="lesson-link" onclick="showContent('env')">• Environment</li>
                <li class="lesson-link" onclick="showContent('sql')">• SQL Queries</li>
                <li class="lesson-link" onclick="showContent('viz')">• Visualization</li>
            </ul>
            <div id="cert-section" style="margin-top: 20px;">
                <strong>Progress:</strong>
                <div class="progress-bar-bg"><div id="main-progress" class="progress-bar-fill"></div></div>
            </div>
        </div>
        <div class="content-area" id="content-area"><h2>Welcome!</h2><p>Select a module to start.</p></div>
    </div>
    <script>
        let currentUser = localStorage.getItem('currentUser');
        if(!currentUser) { window.location.href = 'login.html'; }
        let progress = JSON.parse(localStorage.getItem(currentUser + '_prog')) || { data:0, env:0, sql:0, viz:0 };
        function updateUI() {
            let total = Object.values(progress).reduce((a,b)=>a+b, 0);
            document.getElementById('main-progress').style.width = total + "%";
            if(total >= 80) {
                document.getElementById('cert-section').innerHTML += `<br><a href="certificate.html" style="color:yellow; font-weight:bold;">Get Certificate</a>`;
            }
        }
        function markDone(id) { progress[id] = 20; localStorage.setItem(currentUser + '_prog', JSON.stringify(progress)); updateUI(); alert("Module Completed!"); }
        const content = {
            'data': `<h2>1. Introduction</h2><iframe width="100%" height="300" src="https://www.youtube.com/embed/yZvFH7B6gKI"></iframe><br><button class="btn-done" onclick="markDone('data')">Mark Done</button>`,
            'env': `<h2>2. Environment</h2><iframe width="100%" height="300" src="https://www.youtube.com/embed/hiS_mWZmmI0"></iframe><br><button class="btn-done" onclick="markDone('env')">Mark Done</button>`,
            'sql': `<h2>3. SQL</h2><iframe width="100%" height="300" src="https://www.youtube.com/embed/kbKty5ZVKMY"></iframe><br><button class="btn-done" onclick="markDone('sql')">Mark Done</button>`,
            'viz': `<h2>4. Viz</h2><iframe width="100%" height="300" src="https://www.youtube.com/embed/MiiANxRHSv4"></iframe><br><button class="btn-done" onclick="markDone('viz')">Mark Done</button>`
        };
        function showContent(id) { document.getElementById('content-area').innerHTML = content[id]; }
        updateUI();
    </script>
</body>
</html>
