<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0b1a26; color: white; height: 100vh; }
        .header { padding: 15px; background: #1c2e3d; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4facfe; }
        .page { padding: 20px; display: none; }
        .active { display: block; }
        .card { background: #1c2e3d; padding: 20px; border-radius: 10px; width: 250px; border: 1px solid #4facfe; }
        .module { color: #4facfe; cursor: pointer; margin: 10px 0; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div onclick="showPage('dashboard')">🏠</div>
        <div>Online Learning System</div>
        <div onclick="showPage('settings')">⋮</div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="page active">
        <div class="card">
            <h3>Data Analytics</h3>
            <button id="enrollBtn" onclick="enroll()">Enroll Now</button>
        </div>
    </div>

    <!-- Course Content -->
    <div id="content" class="page">
        <h3>Modules</h3>
        <span class="module" onclick="openVideo()">1. Introduction</span>
        <div id="videoArea"></div>
        <button onclick="showPage('dashboard')">Back to Dashboard</button>
    </div>

    <!-- Settings -->
    <div id="settings" class="page">
        <h3>Account Settings</h3>
        <input type="text" placeholder="Update Name">
        <button onclick="showPage('dashboard')">Save & Back</button>
    </div>

    <script>
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        function enroll() {
            localStorage.setItem('enrolled', 'true');
            document.getElementById('enrollBtn').innerText = "Continue Learning";
            showPage('content');
        }

        function openVideo() {
            document.getElementById('videoArea').innerHTML = '<iframe src="https://www.youtube.com/embed/yZvFH7B6gKI" width="100%" height="300"></iframe>';
        }

        // Check enrollment on load
        if(localStorage.getItem('enrolled') === 'true') {
            document.getElementById('enrollBtn').innerText = "Continue Learning";
        }
    </script>
</body>
</html>
