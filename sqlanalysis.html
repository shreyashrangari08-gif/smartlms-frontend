<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0b1a26; color: white; }
        .header { padding: 15px; background: #1c2e3d; display: flex; justify-content: space-between; border-bottom: 2px solid #4facfe; }
        .sidebar { width: 250px; background: #1c2e3d; height: 100vh; position: fixed; display: none; padding-top: 20px; }
        .main { margin-left: 260px; padding: 20px; }
        .card { background: #1c2e3d; padding: 20px; border-radius: 10px; border: 1px solid #4facfe; width: 250px; }
        button { cursor: pointer; padding: 10px; background: #4facfe; border: none; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Online Learning System</h2>
        <div onclick="showSettings()" style="cursor:pointer; font-size:24px;">⋮</div>
    </div>

    <div id="sidebar" class="sidebar">
        <button onclick="changeView('dashboard')">Back to Dashboard</button>
        <p style="padding:10px;">1. Introduction</p>
    </div>

    <div class="main" id="main-area">
        <div id="dashboard" class="card">
            <h3>Data Analytics</h3>
            <button onclick="startCourse()">Enroll Now</button>
        </div>
        <div id="settings" style="display:none;">
            <h3>Account Settings</h3>
            <input type="text" placeholder="Full Name">
            <button onclick="changeView('dashboard')">Save</button>
        </div>
    </div>

    <script>
        function startCourse() {
            localStorage.setItem('page', 'course');
            document.getElementById('sidebar').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }

        function changeView(view) {
            localStorage.setItem('page', view);
            location.reload();
        }

        function showSettings() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('settings').style.display = 'block';
        }

        // Page load hote hi check karein ki kahan the
        window.onload = function() {
            if(localStorage.getItem('page') === 'course') {
                startCourse();
            }
        }
    </script>
</body>
</html>
