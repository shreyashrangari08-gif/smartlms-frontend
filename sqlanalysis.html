<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; font-family: sans-serif; background: #0b1a26; color: white; height: 100vh; overflow: hidden; }
        .header-bar { padding: 15px; background: #1c2e3d; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #4facfe; }
        .main-container { display: flex; height: 100%; }
        
        /* Views */
        .page { display: none; padding: 40px; width: 100%; }
        .active { display: block; }
        
        /* Dashboard Card */
        .dash-card { background: #1c2e3d; padding: 30px; border-radius: 15px; border: 1px solid #4facfe; width: 300px; }
        
        /* Settings Form */
        .settings-card { background: #1c2e3d; padding: 30px; border-radius: 15px; border: 1px solid #4facfe; width: 80%; max-width: 500px; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #0b1a26; border: 1px solid #4facfe; color: white; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="cursor:pointer;" onclick="showPage('dashboard')">🏠</div>
        <h2 style="margin:0;">Online Learning System</h2>
        <div style="cursor:pointer; font-size:24px;" onclick="showPage('settings')">⋮</div>
    </div>

    <!-- Dashboard Page -->
    <div id="dashboard" class="page active">
        <div class="dash-card">
            <h3>Data Analytics Course</h3>
            <p>Master SQL, R, and Tableau.</p>
            <button onclick="alert('Course Started!')">Enroll Now</button>
        </div>
    </div>

    <!-- Settings Page -->
    <div id="settings" class="page">
        <div class="settings-card">
            <h2>Account Settings</h2>
            <input type="text" placeholder="Full Name">
            <input type="email" placeholder="Email Address">
            <textarea placeholder="Bio"></textarea>
            <button onclick="showPage('dashboard')">Save & Back to Dashboard</button>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            // Saare pages hide karo
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Selected page show karo
            document.getElementById(pageId).classList.add('active');
        }
    </script>
</body>
</html>
